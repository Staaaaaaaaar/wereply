<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wereply · 回复控制台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><header><div><h1>wereply<span>回复控制台</span></h1><p>让每次回复都有明确的对象与规则。</p></div><button id="toggle" disabled>读取状态中</button></header><p id="notice" role="status" aria-live="polite"></p><p id="feedback" role="status" aria-live="polite"></p><section class="health"><h2>微信连接</h2><p id="connection">正在检查…</p><p id="account" class="muted"></p><p id="activity"></p><p id="batch" class="muted"></p></section><div class="workspace"><section><h2>回复规则</h2><p class="muted">第一版支持指定私聊对象。开启后，新消息才会生成回复任务。</p><form id="search"><label>查找回复对象<input name="query" required maxlength="100" placeholder="输入昵称或备注，例如小可软软糖"></label><button type="submit">搜索联系人</button></form><p id="searchStatus" role="status"></p><div id="contacts"></div><form id="rule"><label>已选对象<input name="display" readonly placeholder="请先搜索并选择联系人"></label><label>内部会话 ID<input name="chat" required maxlength="200" placeholder="wxid_… 或 filehelper" aria-describedby="idHelp"></label><p id="idHelp" class="muted">内部 ID 与可修改的微信号不同。搜索并选择后会自动填写，保存时再次核对。</p><label>回复方式<select name="mode"><option value="fixed">固定文本</option><option value="llm">LLM 生成</option></select></label><label id="bodyLabel">回复文本 / LLM 提示词<textarea name="body" required maxlength="4000" rows="5" placeholder="输入固定回复，或描述 LLM 的回复方式"></textarea></label><label class="check"><input name="enabled" type="checkbox" checked>启用此规则</label><button type="submit">保存规则</button><button type="button" id="clear" class="secondary">清空表单</button></form><div id="rules"></div></section><section><h2>最近回复</h2><p class="muted">“本地已确认”仅代表微信本地记录。结果未知时可核对，不会重新发送。</p><div id="jobs"></div></section></div><footer>仅本机访问 · 首次启动扫描历史，不回复旧消息 · 每次重启默认暂停</footer></main></body></html>
